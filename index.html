<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap"/>
		<link rel="stylesheet" href="styles.css" />
		
		<title>Post-card</title>
	</head>
	<body>
		<div class="postcard">
			<div class="postcard-header">
				<h1>My Postcard</h1>
				<img src="https://storage.googleapis.com/breathecode-asset-images/5318bde604cf5c915f94897a71b49ab2523101322ea21cb046db1e67c24fa3be.png" alt="Imagen ramdon"/>
			</div>
			<div class="postcard-body">
			<div class="body-left">
			<p>
			Lorem ipsum dolor sit amet consectetur adipisicing elit. Iusto labore harum ad, eaque autem minus optio! 
			Dolore omnis pariatur molestias ipsam, perferendis eius dolores, doloremque, reprehenderit nisi tempore 
			non consequatur.
			</p>
			</div>
			<div class="body-right">
				<input type="text" name="name" id="name" placeholder="Some Name" />
				<input type="text" name="email" id="email" placeholder="Some Email" />
				<input type="text" name="comment" id="comment" placeholder="Some Comment"/>
			</div>
		</div>
		<div class="postcard-footer">
			<button>Send My Postcard</button>
			</div>
		</div>
	</body>
</html>
